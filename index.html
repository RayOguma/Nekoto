<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ねこと</title>
    <style>
      /* 色は、つなぎのテーマと同じ変数（--ui-〜、--editor-〜、--role-〜）。main.ts が、設定の文から書き込む。 */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ui-ground);
        color: var(--ui-text);
        font-family: "BIZ UDPGothic", "Yu Gothic UI", "Hiragino Sans", sans-serif;
        font-size: 14px;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      button {
        font: inherit;
        color: inherit;
      }

      /* ---- 上：ゲーム。窓の幅いっぱい。高さは窓の高さの 55%（main.ts が、見える横幅を合わせる） ---- */
      #stage {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        justify-content: center;
        background: #000;
      }
      #game {
        display: block;
        height: 55vh;
      }
      /* メニュー（タイトルとステージ選択）のときは、ゲームを窓いっぱいにして、エディタを隠す。 */
      body.menu #game {
        height: 100vh;
      }
      body.menu #editor-pane {
        display: none;
      }
      #game:focus {
        outline: none;
      }
      #start {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-size: 26px;
        border: none;
        cursor: pointer;
      }
      #start[hidden],
      #cleared[hidden],
      #problems[hidden] {
        display: none;
      }
      #cleared {
        position: absolute;
        left: 50%;
        bottom: 10%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px 14px 10px 20px;
        border-radius: 10px;
        background: var(--ui-raised);
        border: 1px solid var(--ui-highlight);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        font-size: 20px;
        font-weight: bold;
        color: var(--ui-highlight);
      }

      /* ---- 下：エディタ ---- */
      #editor-pane {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--ui-panel);
        border-top: 1px solid var(--ui-border);
      }
      /* タブの並び。今のステージのファイルが1つ。右に操作のボタン。 */
      #tabs {
        flex: 0 0 auto;
        display: flex;
        align-items: stretch;
        height: 36px;
        background: var(--ui-panel-2);
        border-bottom: 1px solid var(--ui-border);
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        background: var(--editor-background);
        border-top: 2px solid var(--ui-highlight);
        border-right: 1px solid var(--ui-border);
        color: var(--ui-text);
      }
      .tab .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ui-highlight);
        visibility: hidden;
      }
      .tab.changed .dot {
        visibility: visible;
      }
      #tabs .spacer {
        flex: 1;
      }
      .tool {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 14px;
        background: none;
        border: none;
        border-left: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        cursor: pointer;
      }
      .tool:hover {
        background: var(--ui-hover);
        color: var(--ui-text);
      }
      .tool:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #code {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      /* 問題の一覧（間違いがあるときだけ）。 */
      #problems {
        flex: 0 0 auto;
        max-height: 30%;
        overflow: auto;
        margin: 0;
        padding: 6px 0;
        list-style: none;
        background: var(--ui-panel-2);
        border-top: 1px solid var(--ui-border);
      }
      #problems li {
        padding: 3px 16px;
        color: var(--ui-text);
        cursor: pointer;
      }
      #problems li:hover {
        background: var(--ui-hover);
      }
      #problems li::before {
        content: "✖";
        color: var(--ui-error);
        margin-right: 8px;
      }
      #problems .line {
        color: var(--ui-text-faint);
        margin-left: 8px;
      }
      /* 下の帯。 */
      #status {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 18px;
        height: 24px;
        padding: 0 12px;
        background: var(--ui-accent);
        color: #fff;
        font-size: 12.5px;
      }
      /* 設定の画面（窓の上に重ねる）。 */
      #settings {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 10;
      }
      #settings[hidden] {
        display: none;
      }
      #settings .dialog {
        display: flex;
        flex-direction: column;
        width: min(720px, 92vw);
        height: min(520px, 86vh);
        background: var(--ui-panel);
        border: 1px solid var(--ui-border-strong);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      #settings header {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 8px 0 18px;
        background: var(--ui-panel-2);
        border-bottom: 1px solid var(--ui-border);
        font-weight: bold;
        font-size: 16px;
      }
      #settings header .spacer {
        flex: 1;
      }
      #save-note {
        color: var(--ui-text-muted);
        font-weight: normal;
        font-size: 13px;
        margin-right: 6px;
      }
      #settings-code {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      #settings-problems {
        margin: 0;
        padding: 6px 18px;
        list-style: none;
        color: var(--ui-error);
        background: var(--ui-panel-2);
        border-top: 1px solid var(--ui-border);
      }
      #settings-problems[hidden] {
        display: none;
      }
      #status .spacer {
        flex: 1;
      }
      #status-problems.bad {
        color: #ffd2d2;
      }
    </style>
  </head>
  <body class="menu">
    <div id="app">
      <div id="stage">
        <canvas id="game" width="800" height="450" tabindex="0"></canvas>
        <button id="start" type="button">クリックで はじめる</button>
        <div id="cleared" hidden>
          <span>🐾 クリア！</span>
          <button id="next" class="tool" type="button">つぎのステージへ ▶</button>
        </div>
      </div>
      <div id="editor-pane">
        <div id="tabs">
          <div class="tab" id="tab"><span id="file-name"></span><span class="dot" title="書き換えている"></span></div>
          <div class="spacer"></div>
          <button id="open-settings" class="tool" type="button" title="音の大きさやテーマを変える">⚙ せってい</button>
          <button id="menu" class="tool" type="button" title="タイトルとステージ選択に戻る">≡ メニュー</button>
          <button id="reset" class="tool" type="button" title="このステージの文を、はじめの形に戻す">↺ もとに戻す</button>
        </div>
        <div id="code"></div>
        <ul id="problems" hidden></ul>
        <div id="status">
          <span id="status-problems">✔ 問題なし</span>
          <span id="status-stage"></span>
          <span>✏ オレンジの線の行を書き換えられる</span>
          <span class="spacer"></span>
          <span>をこと</span>
        </div>
      </div>
    </div>
    <div id="settings" hidden>
      <div class="dialog">
        <header>
          <span>⚙ せってい</span>
          <span class="spacer"></span>
          <span id="save-note"></span>
          <button id="save-now" class="tool" type="button" title="今の進みと、書き換えた文と、設定を残す（ふだんも自動で残している）">💾 セーブ</button>
          <button id="erase-save" class="tool" type="button" title="残した進み・書き換えた文・設定を、全部消してはじめに戻す">セーブを消す</button>
          <button id="close-settings" class="tool" type="button">◀ もどる</button>
        </header>
        <div id="settings-code"></div>
        <ul id="settings-problems" hidden></ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
